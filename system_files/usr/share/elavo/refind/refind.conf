# Elavo boot menu. elavo-refind installs this file to EFI/refind on the EFI
# system partition and replaces it when the image changes. Do not edit it
# there; put local settings in EFI/refind/local.conf, and Startup Disk
# preferences in /var/lib/elavo/refind.conf (managed by System Settings).
#
# The Elavo entry is in elavo-entries.conf, which elavo-refind rewrites
# after every update and rollback. By default, the main row shows the current
# deployment, and Tab, F2 or + opens a submenu with Previous version (rollback)
# and Recovery (GRUB). That file also sets timeout and default_selection from
# /var/lib/elavo/refind.conf: timeout -1 (boot at once, black screen, no logo or
# icons) when Elavo is the only system on the machine, unless a key is held;
# timeout 5 when it finds Windows, macOS or another EFI system (or when Menu
# is set to always), so that menu is visible. The theme banner is a black fill,
# which keeps a hidden boot black without rEFInd's screensaver -1 (that option
# plus timeout -1 never paints the menu).

# Manual (Elavo) entries first, then other systems rEFInd finds itself.
scanfor manual,internal,external,optical
# GRUB, shim and the fallback loader are reached through Recovery (GRUB),
# not listed again. Elavo's kernels on /boot are listed only through the
# generated entries (elavo-entries.conf sets dont_scan_volumes for /boot).
dont_scan_dirs EFI/fedora,EFI/BOOT,EFI/refind
dont_scan_files shim.efi,shimx64.efi,mmx64.efi,fbx64.efi,grubx64.efi

use_graphics_for linux,windows,osx,grub
# rEFInd 0.14.2 does not clear the default tool list before reading this
# line, so the defaults after our three (About, Shut Down, Restart,
# Firmware) would show again. The gptsync padding fills those slots;
# gptsync is not copied to the ESP, so nothing shows for it.
showtools shutdown,reboot,firmware,gptsync,gptsync,gptsync,gptsync,gptsync,gptsync,gptsync,gptsync,gptsync,gptsync,gptsync,gptsync
hideui singleuser,hints,arrows,badges

include themes/elavo/theme.conf
include elavo-entries.conf
include local.conf
