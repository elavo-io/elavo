# Elavo rEFInd theme (placeholder). The real artwork belongs in
# elavo-visuals with the Plymouth theme. Until then build.sh makes a black background, an Elavo icon from the
# Plymouth logo, and white tool icons from ysUI. Paths are relative to EFI/refind.
#
# Still to do with the real artwork:
#   selection_big themes/elavo/selection_big.png
#   selection_small themes/elavo/selection_small.png
#   font themes/elavo/font.png
#
# Tool-row position: rEFInd 0.14.2 always draws the main OS row at vertical
# centre and the tool row (shutdown, restart, firmware) 16 pixels below it.
# There is no banner, icons_dir or other config token that moves only the
# tool row to the bottom of the screen. A patch to ComputeRow0PosY /
# row1PosY in menu.c would be needed.

banner themes/elavo/background.png
banner_scale fillscreen
icons_dir themes/elavo/icons
big_icon_size 128
small_icon_size 48
