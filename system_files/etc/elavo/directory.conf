# Directory (Active Directory or FreeIPA) settings for this computer.
# elavo-directory applies them after `realm join` and undoes them after
# `realm leave`; elavo-directory.path runs it when the join changes. Run
# `elavo-directory apply` after editing this file on a joined computer.
[Directory]
# Members of these directory groups administer this computer: sudo, the
# administrator password prompt, and the Applications folder. One group per
# line, as the directory names it. Example: AdminGroup=Domain Admins
#AdminGroup=
# FreeIPA also needs its HBAC rule for this computer to allow the services
# greetd, elavo-lock, elavo-passwd, polkit-1, and sudo.
# Sign in as "ada" with home /home/ada, instead of "ada@example.com" and
# /home/ada@example.com. Set to false when two joined domains share names.
ShortNames=true
# The authselect profile restored after leaving the directory: the image's.
LocalProfile=local with-silent-lastlog with-mdns4
